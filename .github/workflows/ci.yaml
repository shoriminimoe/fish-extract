---
name: CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  actions: write

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: fish-actions/install-fish@v1
      - uses: fish-shop/syntax-check@v1

  test-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: fish-extract-test:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run fishtape in container
        run: docker run --rm -v "$PWD":/workspace fish-extract-test:ci -c 'fishtape tests/file-types.fish'

  test-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
      - uses: fish-actions/install-fish@v1
      - uses: melusina-org/setup-macports@v1
      - name: Install dependencies
        run: bash tests/install-dependencies.sh
      - uses: fish-shop/run-fishtape-tests@v1
        with:
          pattern: tests/**.fish

  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        plugin-manager: [fisher, oh-my-fish]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: fish-actions/install-fish@v1
      - name: Install plugin using ${{ matrix.plugin-manager }}
        uses: fish-shop/install-plugin@v2
        with:
          plugin-manager: ${{ matrix.plugin-manager }}
          plugins: ${{ github.workspace }}

      - name: Check plugin is installed
        run: functions -q extract x
        shell: fish {0}
